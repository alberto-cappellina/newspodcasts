[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "newspodcasts"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "langgraph>=0.4",
    "langchain>=0.3",
    "langchain-google-community[gmail]>=2.0",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
